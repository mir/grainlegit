[package]
name = "grainlegit-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
grainlegit = { path = ".." }
libm = "0.2"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "26.0.1", default-features = false, features = ["wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
jpeg-encoder = "0.7.1"
raw-window-handle = "0.6"
wgpu = { version = "26.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
wgpu = { version = "26.0.1", default-features = false, features = ["metal"] }
